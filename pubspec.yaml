name: word_game
description: "So'z Jangi — Uzbek daily word game."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Navigation
  go_router: ^16.1.0

  # Dependency injection
  get_it: ^8.2.0

  # Localization
  easy_localization: ^3.0.8

  # Typography
  google_fonts: ^6.3.2

  # Persistence
  shared_preferences: ^2.5.3

  # Sharing
  share_plus: ^12.0.0

  # Icons (Lucide)
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    # Gzipped word content for the daily word game (built by tool/corpus + tool/generator):
    #   valid_guesses.txt.gz  — accepted-guess dictionary (superset of answers)
    #   answers_tiered.tsv.gz — answer pool + difficulty tier (practice mode)
    #   schedule.json.gz      — 90-day offline fallback daily schedule
    - assets/dictionary/
