name: word_game
description: "So'z Jangi — Uzbek daily word game."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Navigation
  go_router: ^16.1.0

  # Dependency injection
  get_it: ^8.2.0

  # Localization
  easy_localization: ^3.0.8

  # Typography
  google_fonts: ^6.3.2

  # Persistence
  shared_preferences: ^2.5.3

  # Sharing
  share_plus: ^12.0.0

  # Icons (Lucide)
  lucide_icons: ^0.257.0

  # Firebase (analytics, crashlytics, remote config)
  firebase_core: ^4.11.0
  firebase_analytics: ^12.4.3
  firebase_crashlytics: ^5.2.4
  firebase_remote_config: ^6.5.3

  # Monetization
  google_mobile_ads: ^9.0.0
  in_app_purchase: ^3.3.0

  # Local notifications (streak reminder)
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  supabase_flutter: ^2.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    # Gzipped word content for the daily word game (built by tool/corpus + tool/generator):
    #   valid_guesses.txt.gz  — accepted-guess dictionary (superset of answers)
    #   answers_tiered.tsv.gz — answer pool + difficulty tier (practice mode)
    #   schedule.json.gz      — 90-day offline fallback daily schedule
    - assets/dictionary/

# App icon (generated by tool/branding/make_icon.py). Run:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "tool/branding/app_icon_master.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 23
  background_color_ios: "#0B1220"
  adaptive_icon_background: "#0B1220"
  adaptive_icon_foreground: "tool/branding/app_icon_foreground.png"

# Splash screen (SJ mark on the app background). Run:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0B1220"
  image: "tool/branding/app_icon_foreground.png"
  android_12:
    color: "#0B1220"
    image: "tool/branding/app_icon_foreground.png"
  android: true
  ios: true
